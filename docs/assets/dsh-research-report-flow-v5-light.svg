<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
<title id="title">dsh-research-report: ledger | verdict comb | sealed report, with an offline auditor</title>
<desc id="desc">A three-panel audit board. Panel 1 is the content-addressed evidence ledger: a URL, a workspace file, a DOI or inline content is captured (HTTP only through ctx.web, local reads confined to the workspace, a DOI checked syntactically), hashed with SHA-256, stored once as objects/&lt;sha256&gt; (immutable, re-hashed on every read) and journalled in index.jsonl, claims.jsonl, verdicts.jsonl and disproofs.jsonl. Panel 2 is the verdict comb: one claim with its bound snapshot bytes drops through five first-match prongs and leaves as exactly one of the five verdict words, the first being the integrity gate (unequal bytes mean contradicted) and the rest the byte-level branches of verifyClaimText: no binding or no literal to locate means unverified, a label carrying another number means disproven, an unlocatable literal means insufficient, every literal located means verified. Verdicts and disproofs are written back to the ledger. Panel 3 is the sealed report directory: report.md, verification.jsonl and disconfirmation.jsonl fold into manifest.json, and the seal is the SHA-256 of that file&#x27;s bytes. The rail under the board sits outside the plugin: the standalone dsh-research-verify binary, with zero @deepseek-ai imports, recomputes the seal, the report hash, the journal hashes and every claim verdict from the directory alone.</desc>
